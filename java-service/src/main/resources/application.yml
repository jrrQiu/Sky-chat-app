server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sky-chat-java-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/skychat}
    username: ${DB_USERNAME:skychat}
    password: ${DB_PASSWORD:password123}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

agent-service:
  url: ${AGENT_SERVICE_URL:http://localhost:8000}
  # HS256 key for the short-lived internal service JWT (Java mints, Python verifies).
  # Intentionally has NO default: the service refuses to start without it, because a
  # guessable default would make every internal call forgeable.
  internal-jwt-secret: ${AGENT_INTERNAL_JWT_SECRET:}
  # Legacy static bearer. No longer the primary credential; kept for compatibility only.
  token: ${AGENT_SERVICE_TOKEN:}

auth:
  jwt-secret: ${JWT_SECRET:skychat-local-jwt-secret-change-me}
  jwt-ttl-seconds: ${JWT_TTL_SECONDS:604800}

skychat:
  auth:
    # Self-registration is off by default; operators opt in explicitly.
    self-registration-enabled: ${AUTH_SELF_REGISTRATION_ENABLED:false}
  invite:
    # Where an invite link points: the front-end route rendering the set-password page.
    base-url: ${INVITE_BASE_URL:http://localhost:5173/invite}
    ttl-hours: ${INVITE_TTL_HOURS:72}
  bootstrap:
    # Set this to seed the first administrator. On startup, if no active administrator
    # exists, an admin invitation is issued for this address and the link is logged once.
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  http:
    # Only enable behind a reverse proxy that always rewrites X-Forwarded-For.
    # The env var name is shared with the Python agent service on purpose: one
    # deployment-wide switch must not have two names.
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
  audit:
    # Retention contract for the (not yet implemented) audit purge job.
    retention-months: ${AUDIT_RETENTION_MONTHS:12}
  rate-limit:
    login:
      per-ip:
        limit: ${RATE_LIMIT_LOGIN_PER_IP:10}
      per-email:
        limit: ${RATE_LIMIT_LOGIN_PER_EMAIL:5}
    register:
      per-ip:
        limit: ${RATE_LIMIT_REGISTER_PER_IP:5}
    chat:
      per-user:
        limit: ${RATE_LIMIT_CHAT_PER_USER:60}
    approval-decision:
      per-user:
        limit: ${RATE_LIMIT_APPROVAL_DECISION_PER_USER:30}
    invitation-accept:
      per-ip:
        limit: ${RATE_LIMIT_INVITATION_ACCEPT_PER_IP:10}
    admin:
      per-user:
        limit: ${RATE_LIMIT_ADMIN_PER_USER:120}
  approval:
    # Delay between resume reconciler ticks, and its initial delay after startup.
    resume-retry-ms: ${APPROVAL_RESUME_RETRY_MS:15000}
    resume-retry-initial-ms: ${APPROVAL_RESUME_RETRY_INITIAL_MS:20000}
