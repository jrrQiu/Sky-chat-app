agents:
  # NOTE ON TOOLS
  # Only the tools in `app/tools/catalog.py` exist, and every one of them talks to a real
  # system -- currently the Java service's ticket API. The IdP/MDM/HRIS/ERP tools were removed:
  # they returned hardcoded strings ("账号和配置已开通", a fabricated `IT-IDP-10086`) and a model
  # will call anything it is offered. `/ready` lists what is implemented, what is declared, and
  # what is approval-gated.
  #
  # NOTE ON `permissions`
  # `authorize_agent` grants access when the user holds ANY of an agent's permissions, so these
  # must stay specific to the agent. `service:request` gates access to the service-desk agents
  # and is held by every authenticated role; `knowledge:read` gates the knowledge agent. Adding a
  # broadly-held *tool* permission (e.g. `ticket:read`) here would make the agent reachable by
  # everyone who holds it -- a widening a unit test caught once already, and the reason
  # tool-level authorization lives in `catalog.py`/`rbac.py` instead.
  - id: orchestrator
    name: Orchestrator
    description: Classifies intent, assesses risk, and routes to specialist agents.
    model_hint: lightweight-classifier
    prompt_version: 1
    tools:
      - ticket_list
    permissions:
      - service:request

  - id: it
    name: IT Agent
    description: Handles device and account problems and raises tickets for the service desk.
    model_hint: general-with-tool-calling
    prompt_version: 1
    tools:
      - ticket_create
      - ticket_list
      # Read-only, and the reason the agent loop earns its keep: "list my tickets, then show me
      # that one" is two calls where the second depends on the first.
      - ticket_get
      # Public replies only, and only when the user dictates the content -- the agent records
      # what the user said rather than speaking for them. Internal notes stay a human action in
      # the tickets UI; `visibility` is not even in this tool's schema.
      - ticket_comment
      # Approval-gated and destructive: reachable only through the approval gate, never offered
      # to the model (see `tools/catalog.py` and the assertion in tests/test_action_registry.py).
      - ticket_merge
    permissions:
      - service:request

  - id: network
    name: Network Agent
    description: Handles network and access problems and raises tickets for the service desk.
    model_hint: general-with-tool-calling
    prompt_version: 1
    tools:
      - ticket_create
      - ticket_list
      - ticket_get
      - ticket_comment
      - ticket_merge
    permissions:
      - service:request

  - id: hr
    name: HR Agent
    description: Handles employee questions and raises tickets for the service desk.
    model_hint: general-with-tool-calling
    prompt_version: 1
    tools:
      - ticket_create
      - ticket_list
      - ticket_get
      - ticket_comment
      - ticket_merge
    permissions:
      - service:request

  - id: finance
    name: Finance Agent
    description: Handles reimbursement and budget questions and raises tickets for the service desk.
    model_hint: general-with-tool-calling
    prompt_version: 1
    tools:
      - ticket_create
      - ticket_list
      - ticket_get
      - ticket_comment
      - ticket_merge
    permissions:
      - service:request

  - id: knowledge
    name: Knowledge Agent
    description: Retrieves policies, SOPs, and historical tickets with citations.
    model_hint: embedding-reranker-general
    prompt_version: 1
    tools:
      - ticket_list
      - ticket_get
    permissions:
      - knowledge:read

  - id: approval
    name: Approval Agent
    description: Decides whether approval is required and manages approval tasks.
    model_hint: rules-first
    prompt_version: 1
    # No tools: the approval flow is driven by the graph nodes and the approval store, not by a
    # tool the model can call.
    tools: []
    permissions:
      - approval:read

  - id: guardian
    name: Guardian Agent
    description: Checks permissions, sensitive data, prompt injection, and results.
    model_hint: rules-or-independent-model
    prompt_version: 1
    # No tools: guarding happens in the `guardian_input`/`guardian_output` nodes and in
    # `core/guardrails.py`, so an agent with tool access here would only widen the surface.
    tools: []
    permissions:
      - service:request
