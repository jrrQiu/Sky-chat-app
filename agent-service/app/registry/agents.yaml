agents:
  # NOTE ON TOOL HONESTY
  # Only ticket_create / ticket_get / ticket_list / ticket_comment are implemented against a
  # real system (the Java service). Every other tool name below is still a stub that returns
  # canned text; the adapter marks those results `simulated: true` and `/ready` lists which is
  # which under `tools.real` / `tools.mock`. Do not describe this deployment as integrated with
  # IdP/MDM/HRIS/ERP until those adapters exist.
  #
  # NOTE ON `permissions`
  # `authorize_agent` grants access when the user holds ANY of an agent's permissions, so these
  # must stay specific to the agent (e.g. `network:*`). Adding a broadly-held permission such as
  # `ticket:read` here would make the agent reachable by every role that holds it -- a widening
  # that a unit test caught once already. Tool-level authorization belongs in
  # `app/registry/rbac.py:TOOL_PERMISSIONS`, which is per-tool and needs no entry here.
  - id: orchestrator
    name: Orchestrator
    description: Classifies intent, assesses risk, and routes to specialist agents.
    model_hint: lightweight-classifier
    prompt_version: 1
    tools:
      - agent_registry
      - policy_api
      - ticket_list
    permissions:
      - agent:select
      - run:read

  - id: it
    name: IT Agent
    description: Handles password reset, software install, device issues, and unlocks.
    model_hint: general-with-structured-output
    prompt_version: 1
    tools:
      - idp
      - mdm
      - software_center
      - ticket_create
      - ticket_list
    permissions:
      - it:password_reset
      - it:device:read
      - it:software:install

  - id: network
    name: Network Agent
    description: Handles VPN, Wi-Fi, firewall, and internal system access.
    model_hint: general-with-tool-calling
    prompt_version: 1
    tools:
      - vpn_api
      - cmdb
      - permission_system
      - ticket_create
      - ticket_list
    permissions:
      - network:vpn:read
      - network:vpn:create
      - network:access:read

  - id: hr
    name: HR Agent
    description: Handles leave, onboarding, certificates, and employee data.
    model_hint: general
    prompt_version: 1
    tools:
      - hris
      - organization_service
      - form_service
      - ticket_create
      - ticket_list
    permissions:
      - hr:profile:read
      - hr:leave:read
      - hr:onboarding:read

  - id: finance
    name: Finance Agent
    description: Handles reimbursement, invoices, budgets, purchases, and payments.
    model_hint: general-with-ocr
    prompt_version: 1
    tools:
      - erp
      - ocr
      - budget_service
      - ticket_create
      - ticket_list
    permissions:
      - finance:invoice:read
      - finance:budget:read

  - id: knowledge
    name: Knowledge Agent
    description: Retrieves policies, SOPs, and historical tickets with citations.
    model_hint: embedding-reranker-general
    prompt_version: 1
    tools:
      - pgvector
      - elasticsearch
      - reranker
      - ticket_list
    permissions:
      - knowledge:read

  - id: approval
    name: Approval Agent
    description: Decides whether approval is required and manages approval tasks.
    model_hint: rules-first
    prompt_version: 1
    tools:
      - rule_engine
      - temporal
      - notification_system
    permissions:
      - approval:read
      - approval:create

  - id: guardian
    name: Guardian Agent
    description: Checks permissions, sensitive data, prompt injection, and results.
    model_hint: rules-or-independent-model
    prompt_version: 1
    tools:
      - rbac
      - dlp
      - audit_service
    permissions:
      - audit:write
      - policy:enforce
